<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Card</title>
    <style>
    body {
        background: linear-gradient(rgba(242, 86, 180, 0.779), rgb(255, 255, 255));
        font-family: 'Times New Roman', serif;
        text-align: center; 
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: black;
        background-color: rgb(255, 255, 255);
        font-size: 40px;
        display: inline-block; 
        padding: 10px 20px;
        margin: 20px auto;
        border-radius: 5px;
    }

    h2 {
        color: #FAF8F1;
        background-color: #cd0b76;
        display: inline-block;
        padding: 5px 15px;
        margin: 10px auto;
    }

    img {
        display: block;
        margin: 20px auto;
        border: 5px solid white; 
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    ul {
        display: inline-block; 
        text-align: left;
        margin: 0 auto;
        padding-left: 20px;
    }
    </style>
</head>
<body>
    <h1>It's My Birthday!</h1>
    <br> 
    <h2>On the 16th February</h2>

    <img src="birthday.png" width="300px" height="auto" alt="kue"/>
    
    <h3>What to bring:</h3>
    <ul>
        <li>Baloons (I love baloons)</li>
        <li>Cake (I'm really good at eating)</li>
        <li>An appetite (There will be lots of food)</li>
    </ul>

    <h3>This is where you need to go:</h3>
    <a href="https://maps.app.goo.gl/WM73KpeStEVFSHyu7">Google map link</a>
</body>
</html>
